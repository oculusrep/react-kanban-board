# Deploys the wardrobe Worker (wardrobe/) to Cloudflare. Runs from your phone:
# GitHub app/site → Actions → "Deploy wardrobe" → Run workflow.
# Needs repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, WARDROBE_TOKEN (see wardrobe/README.md).
# Idempotent: creates the D1 database and R2 bucket only if they don't exist yet.
name: Deploy wardrobe

on:
  workflow_dispatch:
  push:
    branches: [main, claude/wardrobe-database-app-dw77m3]
    paths:
      - 'wardrobe/**'
      - '.github/workflows/wardrobe-deploy.yml'

concurrency:
  group: wardrobe-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wardrobe
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WARDROBE_TOKEN: ${{ secrets.WARDROBE_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$WARDROBE_TOKEN" ] || missing="$missing WARDROBE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping wardrobe deploy — repo secrets not set:$missing (see wardrobe/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$WARDROBE_TOKEN" | grep -Eq '^[A-Za-z0-9._~-]{24,}$'; then
            echo "::error::WARDROBE_TOKEN must be 24+ characters of letters, digits, - _ . ~ only (it goes in a URL)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wardrobe/package-lock.json

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.secrets.outputs.ready == 'true'
        run: npm run typecheck

      - name: Ensure D1 database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="wardrobe") | .uuid' | head -n1; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Creating D1 database 'wardrobe'"
            npx wrangler d1 create wardrobe
            id="$(find_id)"
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_ID/$id/" wrangler.jsonc
          echo "D1 database id: $id"

      - name: Ensure R2 bucket
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if npx wrangler r2 bucket info wardrobe-photos >/dev/null 2>&1; then
            echo "R2 bucket exists"
          else
            echo "Creating R2 bucket 'wardrobe-photos'"
            npx wrangler r2 bucket create wardrobe-photos
          fi

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply wardrobe --remote

      - name: Deploy Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Set WARDROBE_TOKEN secret
        if: steps.secrets.outputs.ready == 'true'
        run: printf '%s' "$WARDROBE_TOKEN" | npx wrangler secret put WARDROBE_TOKEN

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n1)"
          {
            echo "## Wardrobe deployed"
            echo ""
            echo "- Web page: ${url:-'(see deploy log)'}"
            echo "- Connector URL for Claude / ChatGPT: \`${url:-https://wardrobe.<subdomain>.workers.dev}/mcp/<your WARDROBE_TOKEN>\`"
          } >> "$GITHUB_STEP_SUMMARY"
