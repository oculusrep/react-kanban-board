# Supabase configuration

# QuickBooks OAuth callback needs to be publicly accessible
# because it's called by QuickBooks redirect (no apikey header possible)
[functions.quickbooks-callback]
verify_jwt = false

# send-portal-comment-alert: verify_jwt back ON (2026-09-22). It used to be
# disabled so the pg_cron drain could call it without a service-role key in
# vault, which left it callable by anyone on the internet. The cron now sends a
# gateway-valid JWT plus X-Cron-Secret, and the function rejects anything else
# (_shared/caller-auth.ts, service-only). No [functions.*] block = default true.

# MCP server consumed by the OpenClaw market-research subagent. Auth is via the
# Authorization: Bearer <OVIS_MCP_BEARER_TOKEN> header, validated inside the
# function. Skipping Supabase JWT lets OpenClaw call without minting a user JWT.
[functions.ovis-research-mcp]
verify_jwt = false


# ovis-site-research-worker: internal only, and it must stay verify_jwt = false.
# Both callers — kickWorker() and the per-minute pg_cron tick — send X-Worker-Secret
# and no Authorization header, so JWT verification at the gateway 401s them before the
# function runs and every run sits queued forever. The function checks the secret itself
# against vault (index.ts:147). This block exists because a plain `supabase functions
# deploy` applies config.toml and silently reset a server-side --no-verify-jwt to the
# default true on 2026-09-27, which stopped site research dead until it was spotted.
[functions.ovis-site-research-worker]
verify_jwt = false
